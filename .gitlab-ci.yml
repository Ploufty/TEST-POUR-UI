# Intégration continue sur la Forge (GitLab)
# - Demande de fusion / autre branche : vérification de outils.json + compilation d'essai
# - Branche principale : compilation et publication sur GitLab Pages
image: node:22-alpine

cache:
  key: { files: [package-lock.json] }
  paths: [.npm/]

before_script:
  - npm ci --cache .npm --prefer-offline --no-audit --no-fund

verifier:
  stage: test
  script:
    - npm run build
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  script:
    - npm run build
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
