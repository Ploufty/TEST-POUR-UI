# Forge (GitLab) : compilation + contrôle de sécurité à chaque envoi,
# publication sur GitLab Pages uniquement depuis la branche principale.
image: node:22-alpine

cache:
  key: { files: [package-lock.json] }
  paths: [.npm/]

before_script:
  - npm ci --cache .npm --prefer-offline --no-audit --no-fund

verifier:
  stage: test
  script: [npm run compiler]
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  script: [npm run compiler]
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
